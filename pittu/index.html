<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pittu — seven stones</title>
    <meta name="description" content="A 90s gali game. Knock down the seven stones, restack them before the fielders hit you with the ball." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/retro.css" />
    <style>
      /* Keep messages clear of the throw line at the bottom. */
      #message {
        top: 16%;
        bottom: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <header id="hud">
      <div class="brand">PITTU<span>'94</span></div>
      <div class="stats">
        <div>PITTU <b id="score">0</b></div>
        <div>BEST <b id="best">0</b></div>
      </div>
    </header>

    <div id="message" aria-live="polite"></div>

    <footer id="help">
      THROW: DRAG BACK &amp; RELEASE · OR <kbd>←</kbd><kbd>→</kbd> AIM + HOLD <kbd>SPACE</kbd> · RUN: <kbd>ARROWS</kbd>/<kbd>WASD</kbd> OR HOLD &amp; DRAG ·
      STACK <em>BIG → SMALL</em> · DODGE THE BALL · <kbd>M</kbd> MUTE
    </footer>

    <div id="crt" aria-hidden="true"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
